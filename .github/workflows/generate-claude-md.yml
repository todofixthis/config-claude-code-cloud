name: Generate CLAUDE.md

on:
  push:
    branches: [main]
    paths:
      - cloud/CLAUDE.cloud-only.md
  workflow_dispatch: {}

# Default GITHUB_TOKEN goes unused below — the checkout and push both run
# as the CLAUDE_MD_BOT_APP_ID app instead, a bypass actor on main's ruleset
# (see README.md). contents: read is enough for whatever this token does touch.
permissions:
  contents: read

concurrency:
  group: generate-claude-md
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CONFIG_CLAUDE_READ_TOKEN }}
    steps:
      - name: Generate a bot token
        id: bot-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_MD_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_MD_BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - name: Regenerate, commit, and push
        run: |
          git config user.name "config-claude-md-bot[bot]"
          git config user.email "config-claude-md-bot[bot]@users.noreply.github.com"
          bash cloud/generate-claude-md.sh
          for attempt in 1 2 3 4 5; do
            git add cloud/CLAUDE.md
            if git diff --cached --quiet; then
              echo "⏭️ no changes to cloud/CLAUDE.md"
              exit 0
            fi
            version="$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)"
            sed -i "s/^# Bootstrap version: .*/# Bootstrap version: ${version}/" cloud/pointer.sh
            git add cloud/pointer.sh
            git commit -m "Regenerate cloud/CLAUDE.md"
            if git push; then
              echo "✅ pushed regenerated cloud/CLAUDE.md"
              exit 0
            fi
            echo "⚠️ push rejected (attempt ${attempt}/5) — re-syncing with origin/main and retrying"
            git fetch origin main
            git reset --hard origin/main
            bash cloud/generate-claude-md.sh
            sleep 2
          done
          echo "❌ giving up after 5 attempts"
          exit 1
